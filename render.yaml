services:
  - type: web
    name: fortune-reading
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./fortune.db
      - key: PYTHON_VERSION
        value: 3.13.7
