services:
  - type: web
    name: fortune-reading
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: fortune-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/fortune.db
      - key: IMAGES_DIR
        value: /data/images/posters
      - key: PYTHON_VERSION
        value: 3.13.7
