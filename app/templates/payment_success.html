{% extends "base.html" %}
{% block title %}決済完了 — 星図リーディング{% endblock %}

{% block content %}
<div class="generate-page" style="padding:40px 20px 100px; min-height:100vh; position:relative; z-index:1;">

  <div id="loading-crystal" class="loading-crystal fade-in">
    <span class="loading-crystal-emoji">🔮</span>
    <h2 class="loading-title">決済が完了しました</h2>
    <p class="loading-text">星の配置を読み解いています<span class="loading-dots"></span></p>
  </div>

  <div id="streaming-area" class="streaming-area" aria-live="polite">
    <div class="streaming-header">✦ &nbsp;あなたへのメッセージ&nbsp; ✦</div>
    <div id="streaming-content" class="streaming-content"></div>
  </div>

  <div id="generate-actions" class="generate-actions">
    <a id="result-link" href="/" class="btn btn-primary">✦ 鑑定結果を見る</a>
    <a href="/" class="btn btn-secondary">← トップに戻る</a>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
var readingId = {{ reading.id }};
var readingType = "{{ reading.type }}";
var formData = {{ form_data | tojson }};

function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderMarkdown(text) {
  if (!text) return '';
  var escaped = escapeHtml(text);
  var lines = escaped.split('\n');
  var html = '';
  var inList = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^#{1,3} (.+)/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h3>' + line.replace(/^#{1,3} /, '') + '</h3>';
    } else if (/^[-*] (.+)/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + line.replace(/^[-*] /, '') + '</li>';
    } else if (line.trim() === '') {
      if (inList) { html += '</ul>'; inList = false; }
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<p>' + line + '</p>';
    }
  }
  if (inList) html += '</ul>';
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return html;
}

async function startGeneration() {
  var endpoint = readingType === 'compatibility'
    ? '/api/readings/generate/' + readingId + '?type=compatibility'
    : '/api/readings/generate/' + readingId + '?type=personal';

  var resp = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(formData),
  });

  if (!resp.ok) {
    document.getElementById('loading-crystal').innerHTML =
      '<p style="color:#E8B4C8;">エラーが発生しました。トップに戻ってもう一度お試しください。</p>';
    return;
  }

  var loadingEl = document.getElementById('loading-crystal');
  var streamArea = document.getElementById('streaming-area');
  var streamEl = document.getElementById('streaming-content');
  var actionsEl = document.getElementById('generate-actions');
  var resultLink = document.getElementById('result-link');

  var reader = resp.body.getReader();
  var decoder = new TextDecoder('utf-8');
  var buffer = '';
  var rawText = '';
  var firstChunk = true;
  var isEventDone = false;

  while (true) {
    var result = await reader.read();
    if (result.done) break;
    buffer += decoder.decode(result.value, { stream: true });
    var lines = buffer.split('\n');
    buffer = lines.pop();

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line === '') continue;
      if (line.startsWith('event:')) {
        if (line.replace('event:', '').trim() === 'done') isEventDone = true;
        continue;
      }
      if (line.startsWith('data:')) {
        var data = line.charAt(5) === ' ' ? line.slice(6) : line.slice(5);
        if (isEventDone) {
          var finishedId = parseInt(data, 10);
          isEventDone = false;
          if (finishedId) {
            window.location.href = '/reading/' + finishedId;
            return;
          }
        } else {
          rawText += data;
          if (firstChunk) {
            firstChunk = false;
            loadingEl.style.display = 'none';
            streamArea.classList.add('visible');
          }
          streamEl.innerHTML = renderMarkdown(rawText);
          streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      }
    }
  }

  actionsEl.classList.add('visible');
  if (resultLink) resultLink.href = '/reading/' + readingId;
}

document.addEventListener('DOMContentLoaded', startGeneration);
</script>
{% endblock %}
