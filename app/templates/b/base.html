<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}LUNA ORACLE{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Kaisei+Decol:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta property="og:site_name" content="LUNA ORACLE">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    {% block head %}{% endblock %}
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    :root{
      --bg:#FDFAF6;--bg2:#F5F0E8;
      --text:#2D2A26;--text-body:#4A4540;--text-muted:#6B6560;
      --gold:#D4A574;--gold-bright:#C4935E;--gold-dim:#9B7B5E;
      --cream:#F0E6D6;--muted:#8A7B6B;
      --card:rgba(212,165,116,.03);--card-b:rgba(212,165,116,.12);
      --green:#6B8E5A;--red:#C85C5C;
      --f-head:'Shippori Mincho',serif;
      --f-body:'Zen Kaku Gothic New',sans-serif;
      --f-article:'Kaisei Decol',serif;
      --f-label:'Inter',sans-serif;
      --f-mono:'JetBrains Mono',monospace;
    }
    body{font-family:var(--f-body);font-size:16px;font-weight:500;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    a{color:var(--gold-dim);text-decoration:none;transition:color .3s}
    a:hover{color:var(--text)}

    .container{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:0 20px 100px}

    /* Bottom Tab */
    .bottom-tab{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(253,250,246,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(212,165,116,.12);display:flex;align-items:center;justify-content:space-around;z-index:100;max-width:440px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
    .tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(155,123,94,.25);font-size:8px;font-family:var(--f-label);font-weight:700;letter-spacing:1.5px;text-decoration:none;transition:color .3s;padding:8px 12px}
    .tab-item:hover,.tab-item.active{color:var(--gold-dim)}
    .tab-icon{font-size:18px;height:22px;display:flex;align-items:center;justify-content:center}
    .tab-icon svg{width:20px;height:20px}

    /* Cards */
    .card{background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:22px 18px;margin-bottom:14px;transition:all .3s}
    .card:hover{border-color:rgba(212,165,116,.2);box-shadow:0 2px 12px rgba(0,0,0,.04)}
    .card-label{font-family:var(--f-label);font-size:9px;font-weight:700;letter-spacing:3px;margin-bottom:10px;text-transform:uppercase}

    /* Buttons */
    .btn-dark{width:100%;padding:17px;background:var(--text);border:none;border-radius:12px;color:var(--cream);font-family:var(--f-head);font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
    .btn-dark:hover{box-shadow:0 4px 20px rgba(45,42,38,.2);transform:translateY(-1px)}
    .btn-outline{width:100%;padding:14px;background:transparent;border:1px solid var(--card-b);border-radius:10px;color:var(--gold-dim);font-family:var(--f-body);font-size:13px;font-weight:500;cursor:pointer;transition:all .3s}
    .btn-outline:hover{border-color:rgba(212,165,116,.3);color:var(--text)}

    /* Inputs */
    .input-f{width:100%;padding:13px 14px;background:#fff;border:1px solid rgba(212,165,116,.18);border-radius:10px;color:var(--text);font-family:var(--f-body);font-size:15px;text-align:center;outline:none;transition:border-color .3s}
    .input-f:focus{border-color:var(--gold)}
    .input-f::placeholder{color:rgba(155,123,94,.35)}
    select.input-f{appearance:none;cursor:pointer;text-align:left}
    select.input-f option{background:#fff;color:var(--text)}
    textarea.input-f{text-align:left;min-height:80px;resize:vertical;line-height:2}
    .input-label{font-family:var(--f-label);font-size:10px;font-weight:600;letter-spacing:2px;color:rgba(155,123,94,.5);margin-bottom:6px}
    .input-row{display:flex;gap:8px;margin-bottom:12px}
    .input-opt{font-family:var(--f-label);font-size:8px;font-weight:500;letter-spacing:1px;color:rgba(155,123,94,.3);margin-left:4px}

    /* Page header */
    .page-back{display:inline-block;font-family:var(--f-label);font-size:10px;font-weight:600;letter-spacing:2px;color:rgba(155,123,94,.4);margin-bottom:20px}
    .page-back:hover{color:var(--text)}
    .page-title{font-family:var(--f-head);font-size:22px;font-weight:700;color:var(--text);text-align:center;margin-bottom:6px}
    .page-sub{font-size:12px;color:var(--gold-dim);text-align:center;line-height:2;margin-bottom:24px}

    /* Divider */
    .divider-line{width:40px;height:1px;background:rgba(212,165,116,.25);margin:20px auto}

    /* Toast */
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:2px;padding:12px 24px;background:var(--text);color:var(--cream);border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.12);z-index:200;opacity:0;transition:all .4s;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Strong highlighter */
    strong{background:linear-gradient(transparent 60%,rgba(212,165,116,.12) 60%)}

    /* Animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* Footer */
    .footer{margin-top:40px;text-align:center;padding-bottom:16px}
    .footer-text{font-family:var(--f-label);font-size:9px;font-weight:500;letter-spacing:4px;color:rgba(155,123,94,.25)}

    {% block style %}{% endblock %}
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Tab -->
    <div class="bottom-tab">
      <a href="/daily" class="tab-item {% if active_tab == 'daily' %}active{% endif %}">
        <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg></div>
        <span>TODAY</span>
      </a>
      <a href="/reading/new" class="tab-item {% if active_tab == 'oracle' %}active{% endif %}">
        <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg></div>
        <span>ORACLE</span>
      </a>
      <a href="/compatibility/new" class="tab-item {% if active_tab == 'match' %}active{% endif %}">
        <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></div>
        <span>MATCH</span>
      </a>
      <a href="/" class="tab-item {% if active_tab == 'my' %}active{% endif %}">
        <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/></svg></div>
        <span>MY</span>
      </a>
    </div>

    <div class="toast" id="toast"></div>
    {% block scripts %}{% endblock %}
    <script>
    function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
    </script>
</body>
</html>
