<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}星図リーディング{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&family=Quicksand:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <meta property="og:site_name" content="星図リーディング">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <div class="sparkles" id="sparkles" aria-hidden="true"></div>
        <script>
(function() {
  var c = document.getElementById('sparkles');
  var chars = ['✦', '✧', '·'];
  var colors = ['rgba(255,255,255,0.85)','rgba(255,220,255,0.75)','rgba(220,200,255,0.8)','rgba(255,255,255,0.7)'];
  for (var i = 0; i < 18; i++) {
    var s = document.createElement('span');
    s.className = 'sparkle-star';
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.color = colors[Math.floor(Math.random() * colors.length)];
    s.style.fontSize = (Math.random() * 10 + 8) + 'px';
    s.style.animationDuration = (Math.random() * 4 + 3) + 's';
    s.style.animationDelay = (Math.random() * 6) + 's';
    c.appendChild(s);
  }
})();
</script>
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
