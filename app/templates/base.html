<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}星図リーディング{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Kaisei+Decol:wght@400;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% set theme = request.state.theme if request and request.state and request.state.theme else 'default' %}
    {% if theme and theme != 'default' %}
    <link rel="stylesheet" href="/static/css/theme-{{ theme }}.css">
    {% endif %}
    <meta property="og:site_name" content="星図リーディング">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    {% block head %}{% endblock %}
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body class="theme-{{ theme }}" data-theme="{{ theme }}">
    <div class="bg-layer"></div>
    <div class="glow-orb a"></div>
    <div class="glow-orb b"></div>
    <div class="glow-orb c"></div>
    <div class="glow-orb d"></div>
    <script>
    (function(){
      var sp=[{chars:['✦','✧'],cls:'star',n:14},{chars:['✦','·'],cls:'lavender',n:8},{chars:['✧','·'],cls:'pink',n:6}];
      sp.forEach(function(g){
        for(var i=0;i<g.n;i++){
          var s=document.createElement('div');
          s.className='sparkle '+g.cls;
          s.textContent=g.chars[i%g.chars.length];
          s.style.left=Math.random()*100+'%';
          s.style.top=Math.random()*100+'%';
          s.style.setProperty('--dur',(2+Math.random()*5)+'s');
          s.style.setProperty('--del',(Math.random()*6)+'s');
          s.style.fontSize=(7+Math.random()*9)+'px';
          document.body.appendChild(s);
        }
      });
    })();
    </script>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
