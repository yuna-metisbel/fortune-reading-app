<form id="reading-form" novalidate>
  {% if profiles %}
  <div class="form-card">
    <div class="form-section-title">SAVED PROFILE</div>
    <select id="saved-profile" class="profile-select">
      <option value="">保存済みプロフィールを選択</option>
      {% for profile in profiles %}
      <option value="{{ profile.id }}"
        data-nickname="{{ profile.nickname }}"
        data-birth-date="{{ profile.birth_date.isoformat() }}"
        data-birth-time="{{ profile.birth_time.strftime('%H:%M') if profile.birth_time else '' }}"
        data-birth-place="{{ profile.birth_place or '' }}"
        data-gender="{{ profile.gender or '' }}"
        data-blood-type="{{ profile.blood_type or '' }}">
        {{ profile.nickname }}（{{ profile.birth_date.strftime('%Y/%m/%d') }}）
      </option>
      {% endfor %}
    </select>
  </div>
  {% endif %}

  <div class="form-card">
    <div class="form-section-title">BASIC INFO</div>

    <div class="input-group">
      <label class="input-label" for="nickname">ニックネーム</label>
      <input type="text" id="nickname" name="nickname" class="text-input" placeholder="呼ばれたい名前" required autocomplete="off">
    </div>

    <div class="input-group">
      <label class="input-label">生年月日</label>
      <div class="date-row">
        <input type="text" id="birth_year" name="birth_year" class="text-input" placeholder="1995" inputmode="numeric" maxlength="4" required autocomplete="off">
        <input type="text" id="birth_month" name="birth_month" class="text-input" placeholder="6" inputmode="numeric" maxlength="2" required autocomplete="off">
        <input type="text" id="birth_day" name="birth_day" class="text-input" placeholder="26" inputmode="numeric" maxlength="2" required autocomplete="off">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="birth_hour">出生時刻 <span class="optional">OPTIONAL</span></label>
      <div class="date-row" style="grid-template-columns: 1fr 1fr;">
        <input type="text" id="birth_hour" name="birth_hour" class="text-input" placeholder="14" inputmode="numeric" maxlength="2" autocomplete="off">
        <input type="text" id="birth_minute" name="birth_minute" class="text-input" placeholder="30" inputmode="numeric" maxlength="2" autocomplete="off">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="birth_place">出生地 <span class="optional">OPTIONAL</span></label>
      <input type="text" id="birth_place" name="birth_place" class="text-input" placeholder="東京都" autocomplete="off">
    </div>

    <div class="input-group">
      <label class="input-label" for="gender">性別</label>
      <select id="gender" name="gender" class="select-input">
        <option value="">選択してください</option>
        <option value="女性">女性</option>
        <option value="男性">男性</option>
        <option value="その他">その他</option>
        <option value="無回答">回答しない</option>
      </select>
    </div>

    <div class="input-group">
      <label class="input-label" for="blood_type">血液型 <span class="optional">OPTIONAL</span></label>
      <select id="blood_type" name="blood_type" class="select-input">
        <option value="">選択してください</option>
        <option value="A">A型</option>
        <option value="B">B型</option>
        <option value="O">O型</option>
        <option value="AB">AB型</option>
      </select>
    </div>
  </div>

  <div class="form-card">
    <div class="form-section-title">READING THEME</div>
    <div class="input-group" style="margin-bottom:0">
      <label class="input-label" for="theme">今気になっていること</label>
      <textarea id="theme" name="theme" class="textarea-input" placeholder="恋愛、仕事、人間関係など&#10;何でも自由に書いてください" required></textarea>
    </div>
  </div>

  <button type="submit" class="submit-btn">✦ 星図を読み解く</button>
</form>
{% endblock %}

{% block scripts %}
<script src="/static/js/reading.js?v=2"></script>
{% endblock %}
